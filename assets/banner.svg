<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VoiceSwitch</title>
  <desc id="desc">Local macOS dictation with GigaAM and Whisper</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#090b18" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="190" fill="#c084fc" opacity=".10"/>
  <circle cx="1070" cy="315" r="240" fill="#22d3ee" opacity=".08"/>
  <g transform="translate(90 74)" filter="url(#shadow)">
    <rect width="212" height="212" rx="54" fill="#ffffff" opacity=".12"/>
    <rect x="2" y="2" width="208" height="208" rx="52" fill="none" stroke="#ffffff" stroke-opacity=".20" stroke-width="4"/>
    <g fill="url(#wave)">
      <rect x="38" y="88" width="13" height="36" rx="6.5"/>
      <rect x="60" y="69" width="13" height="74" rx="6.5"/>
      <rect x="82" y="44" width="13" height="124" rx="6.5"/>
      <rect x="104" y="25" width="13" height="162" rx="6.5"/>
      <rect x="126" y="50" width="13" height="112" rx="6.5"/>
      <rect x="148" y="74" width="13" height="64" rx="6.5"/>
      <rect x="170" y="92" width="13" height="28" rx="6.5"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#ffffff">
    <text x="355" y="158" font-size="78" font-weight="760" letter-spacing="-2">VoiceSwitch</text>
    <text x="359" y="212" font-size="28" font-weight="500" fill="#e0e7ff">GigaAM для русского · Whisper для смешанной речи</text>
    <text x="359" y="266" font-size="22" fill="#c4b5fd">Локально на Mac · fn + Option · без облачного API</text>
  </g>
</svg>
