name: Предложение
description: Предложить улучшение с понятным сценарием использования
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
  - type: dropdown
    id: privacy
    attributes:
      label: Влияет ли функция на передачу аудио или текста?
      options:
        - Нет
        - Возможно
        - Да
    validations:
      required: true
