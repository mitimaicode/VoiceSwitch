name: Ошибка
description: Сообщить о воспроизводимой проблеме VoiceSwitch
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте приватные аудиозаписи, полные журналы или личные расшифровки.
  - type: input
    id: version
    attributes:
      label: Версия VoiceSwitch
      placeholder: v0.2.0-beta
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac и macOS
      placeholder: MacBook Air M3, macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Модель
      options:
        - GigaAM
        - Whisper
        - Qwen3-ASR
        - Apple
        - Несколько моделей
        - Не относится к распознаванию
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Перечислите точные действия.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение и текст ошибки
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Приватность
      options:
        - label: Я удалил(а) из сообщения приватные записи, расшифровки и персональные данные.
          required: true
