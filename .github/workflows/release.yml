name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release archive
        run: |
          chmod +x scripts/*.sh Resources/install_runtime.sh
          ./scripts/package_release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          args=(
            "$GITHUB_REF_NAME"
            dist/VoiceSwitch-*.dmg
            dist/VoiceSwitch-*.dmg.sha256
            dist/VoiceSwitch-*.zip
            dist/VoiceSwitch-*.zip.sha256
            --title "VoiceSwitch ${GITHUB_REF_NAME}"
          )
          if [[ -f "$notes_file" ]]; then
            args+=(--notes-file "$notes_file")
          else
            args+=(--generate-notes)
          fi
          if [[ "$GITHUB_REF_NAME" == *"-"* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
