name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate scripts
        run: |
          zsh -n scripts/*.sh Resources/install_runtime.sh
          python3 -m py_compile worker/asr_worker.py worker/media_worker.py worker/text_worker.py scripts/collect_github_stats.py
          python3 -m unittest discover -s tests -v
          VOICESWITCH_SETUP_VALIDATE_ONLY=1 \
            Resources/install_runtime.sh \
            "$RUNNER_TEMP/VoiceSwitch-Runtime" \
            worker/asr_worker.py \
            worker/text_worker.py \
            gigaam

      - name: Validate installer retry diagnostics
        run: |
          runtime_root="$RUNNER_TEMP/VoiceSwitch-Failing-Runtime"
          mkdir -p "$runtime_root/Tools/uv"
          ln -s /usr/bin/false "$runtime_root/Tools/uv/uv"
          set +e
          output=$(
            VOICESWITCH_RETRY_DELAY_SECONDS=0 \
              Resources/install_runtime.sh \
              "$runtime_root" \
              worker/asr_worker.py \
              worker/text_worker.py 2>&1
          )
          exit_code=$?
          set -e
          test "$exit_code" -ne 0
          printf '%s\n' "$output" | grep -q '__VOICESWITCH_SETUP_ERROR__'
          grep -q 'Устанавливаю изолированный Python 3.12' "$runtime_root/install.log"

      - name: Validate clean GigaAM dependency install
        run: |
          VOICESWITCH_SETUP_DEPENDENCIES_ONLY=1 \
          VOICESWITCH_RETRY_DELAY_SECONDS=0 \
            Resources/install_runtime.sh \
            "$RUNNER_TEMP/VoiceSwitch-GigaAM-Dependencies" \
            worker/asr_worker.py \
            worker/text_worker.py \
            gigaam
          test ! -f "$RUNNER_TEMP/VoiceSwitch-GigaAM-Dependencies/install-complete.txt"

      - name: Build VoiceSwitch
        run: swift build -c release

      - name: Assemble app bundle
        run: |
          chmod +x scripts/*.sh Resources/install_runtime.sh
          ./scripts/build_app.sh "$RUNNER_TEMP/VoiceSwitch"
          codesign --verify --deep --strict "$RUNNER_TEMP/VoiceSwitch/VoiceSwitch.app"
          plutil -lint "$RUNNER_TEMP/VoiceSwitch/VoiceSwitch.app/Contents/Info.plist"
          test -f "$RUNNER_TEMP/VoiceSwitch/VoiceSwitch.app/Contents/Resources/media_worker.py"

      - name: Package pull request test build
        if: github.event_name == 'pull_request'
        run: |
          version=$(tr -d '[:space:]' < server/linux/VERSION)
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/VoiceSwitch/VoiceSwitch.app" \
            "$RUNNER_TEMP/VoiceSwitch-${version}-test.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 "VoiceSwitch-${version}-test.zip" \
            > "VoiceSwitch-${version}-test.zip.sha256"

      - name: Upload pull request test build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: VoiceSwitch-${{ github.event.pull_request.number }}-macos-arm64-test
          path: |
            ${{ runner.temp }}/VoiceSwitch-*-test.zip
            ${{ runner.temp }}/VoiceSwitch-*-test.zip.sha256
          if-no-files-found: error
          retention-days: 7

  server:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Linux Server Edition
        run: |
          bash -n server/linux/install.sh scripts/package_server_release.sh
          python3 -m py_compile \
            server/linux/stt/*.py \
            server/linux/video/*.py \
            server/linux/healthcheck.py
          PYTHONPATH=server/linux/video \
            python3 -m unittest discover -s server/linux/tests -v
          VOICESWITCH_SETUP_VALIDATE_ONLY=1 \
            server/linux/install.sh --core-only --no-start

      - name: Validate optional OpenClaw plugin
        working-directory: server/linux/openclaw-plugin
        run: |
          npm ci --omit=dev --omit=peer --ignore-scripts
          node --check index.js
          node --test \
            index.test.js \
            source-validation.test.js \
            tool-result.test.js \
            worker-scope.test.js

      - name: Package Linux Server Edition
        run: |
          chmod +x server/linux/install.sh server/linux/healthcheck.py scripts/package_server_release.sh
          ./scripts/package_server_release.sh
          archive="dist/VoiceSwitch-Server-$(tr -d '[:space:]' < server/linux/VERSION)-linux-x86_64.tar.gz"
          test -f "$archive"
          test -f "$archive.sha256"
          tar -tzf "$archive" | grep -q '/install.sh$'

      - name: Upload Linux Server test build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: VoiceSwitch-${{ github.event.pull_request.number }}-linux-x86_64-test
          path: |
            dist/VoiceSwitch-Server-*.tar.gz
            dist/VoiceSwitch-Server-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
